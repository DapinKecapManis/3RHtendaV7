  <body>
    <div id="root"></div>
    <script>
      if (window.location.hash === "#galeri") {
        let attempts = 0;
        const scrollToGallery = () => {
          const gallery = document.getElementById("galeri");
          if (gallery) {
            gallery.scrollIntoView({ block: "start", behavior: "instant" });
          } else if (attempts++ < 120) {
            window.requestAnimationFrame(scrollToGallery);
          }
        };
        window.requestAnimationFrame(scrollToGallery);
      }
    </script>
